# Lint, types and tests on every pull request and every push to main. Nothing here needs a secret: the backend's
# tests run in memory (convex-test) and the client's tests in happy-dom, so no environment value is read.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run unused
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:backend
      # First-load JS against scripts/size-budget.json. The build reads only stand-in public values: Clerk's published
      # example key and a placeholder backend address, so no secret is needed and the size matches a real build.
      - run: bun run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_CONVEX_URL: https://sample.convex.cloud
      - run: bun run size
